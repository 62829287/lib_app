<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Каталог сборок Dota 2">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dota Builds">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dota Builds</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #f7f8fa;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    #loading-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #1a1a1a;
      z-index: 9999;
      background: #f7f8fa;
    }
    #loading-splash .title {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    #loading-splash .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #d0d5dd;
      border-top-color: #1565c0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="loading-splash" aria-live="polite" aria-busy="true">
    <div class="title">Dota Builds</div>
    <div class="spinner" role="progressbar" aria-label="Загрузка приложения"></div>
  </div>

  <script>
    (function () {
      var redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect !== location.href) {
        history.replaceState(null, '', redirect);
      }
    })();
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading-splash');
      if (el) el.classList.add('loading-hidden');
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
